<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aurora</title>
    <link rel="stylesheet" href="cafe-aurora.css">
    <script src="cafe-aurora.js" defer></script>
</head>

<body>
    <!-- NAV BAR -->
    <div class="top-bar">
        <img src="./imagenes-cafe-aurora/logo-cafe-aurora.png" alt="Logo Café Aurora" class="logo-cafe">
        <img src="./imagenes-cafe-aurora/hamburguesa-boton.png" alt="Icono menú hamburguesa" class="menu-toggle">
    </div>

    <!-- IMAGEN PRINCIPAL -->
    <div class="container-main-image">
        <img src="./imagenes-cafe-aurora/main-image-cafe-aurora.png" alt="Imagen principal café Aurora"
            class="main-image-coffee">
        <section class="intro">
            <h1>Café Aurora</h1>
            <p>Experiencia artesanal en cada taza</p>
        </section>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section class="categories">
            <div class="categories-div">
                <h2 class="categories-title">Categorías</h2>
                <img src="./imagenes-cafe-aurora/simbolo-de-informacion.png" alt="Simbolo de Info" class="info-icon">
            </div>
            <div class="category-btns">
                <button class="btn-active">Café</button>
                <button class="btn">Postres</button>
                <button class="btn">Bebidas</button>
            </div>
        </section>
        <section class="products">
        <h2>Nuestros productos</h2>
    <div class="card-products">
        <div class="card" type="button">
            <img src="./imagenes-cafe-aurora/espresso-intenso.png" alt="Espresso Intenso">
            <span class="card-title">Espresso Intenso</span>
            <span class="card-description">Café 100% arábica de origen único</span>
            <span class="price">$2.6</span>
        </div>
        <div class="card" type="button">
            <img src="./imagenes-cafe-aurora/tarta-de-choco.png" alt="Tarta de Chocolate">
            <span class="card-title">Tarta de Chocolate</span>
            <span class="card-description">Bizcocho húmedo con ganache</span>
            <span class="price">$6.3</span>
        </div>
        <div class="card" type="button">
            <img src="./imagenes-cafe-aurora/capuccino-clasico.png" alt="Cappuccino Clásico">
            <span class="card-title">Cappuccino Clásico</span>
            <span class="card-description">Espresso con espuma de leche</span>
            <span class="price">$4.2</span>
        </div>
        <div class="card" type="button">
            <img src="./imagenes-cafe-aurora/croissant-artesanal.png" alt="Croissant Artesanal">
            <span class="card-title">Croissant Artesanal</span>
            <span class="card-description">Hojaldrado con mantequilla</span>
            <span class="price">$3.00</span>
        </div>
    </div>
</section>

    </main>

</body>

</html>
